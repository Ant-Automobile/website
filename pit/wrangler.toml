name = "ant-pit"
main = "src/worker.js"
compatibility_date = "2026-05-01"
workers_dev = false
preview_urls = false

routes = [
  { pattern = "example.com/*", zone_id = "YOUR_ZONE_ID" },
  { pattern = "*.example.com/*", zone_id = "YOUR_ZONE_ID" },
]

kv_namespaces = [{ binding = "PIT", id = "YOUR_KV_NAMESPACE_ID" }]

[vars]
ZONE = "example.com"
NEVER = "mail,autoconfig,autodiscover,mta-sts"
KNOWN = ",www,git,docs,go,status,api,webmail"
WEBMAIL_URL = "https://mail.example.com/webmail/"

[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = false

[observability]
enabled = false
